spring.application.name=backend

# Override with environment variables (DB_URL, DB_USERNAME, DB_PASSWORD) outside local dev.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/universityERP}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:12345}
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema + seed data live in src/main/resources/db/migration and are applied on startup.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

logging.level.org.springframework.security=INFO

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=LAX
