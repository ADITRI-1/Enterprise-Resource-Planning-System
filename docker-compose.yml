# Full stack: PostgreSQL + Spring Boot API + web app.
#   docker compose up --build      then open http://localhost:3000
# Set DB_PASSWORD in your environment (or a .env file) for anything beyond local use.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: universityERP
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d universityERP"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/universityERP
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
